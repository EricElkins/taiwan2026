<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asia 2026 · Trip Dossier</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#f1f5f9;line-height:1.6;font-size:16px}

/* Header */
.header{background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);border-bottom:2px solid #334155;padding:2rem 1.5rem}
.header-inner{max-width:900px;margin:0 auto}
.header h1{font-size:1.8rem;font-weight:900;letter-spacing:-.02em;color:#f8fafc}
.header h1 span{color:#f59e0b}
.header .sub{font-size:.9rem;color:#94a3b8;margin-top:.3rem}
.trip-pills{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.pill{background:#1e293b;border:1px solid #334155;color:#cbd5e1;font-size:.75rem;font-weight:600;padding:.25rem .75rem;border-radius:20px}
.pill.green{border-color:#16a34a;color:#4ade80}
.pill.amber{border-color:#d97706;color:#fbbf24}

/* Layout */
.wrap{max-width:900px;margin:0 auto;padding:2rem 1.5rem}
.section{margin-bottom:2.5rem}
.section-title{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#64748b;margin-bottom:.9rem;display:flex;align-items:center;gap:.6rem}
.section-title::after{content:'';flex:1;height:1px;background:#1e293b}

/* Cards */
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:1.2rem 1.5rem;margin-bottom:.75rem}
.card.green{border-left:3px solid #16a34a}
.card.amber{border-left:3px solid #d97706}
.card.blue{border-left:3px solid #3b82f6}
.card.purple{border-left:3px solid #8b5cf6}
.card.slate{border-left:3px solid #475569}

.card-title{font-size:.88rem;font-weight:800;color:#f1f5f9;margin-bottom:.65rem;display:flex;align-items:center;gap:.5rem}
.badge{font-size:.65rem;font-weight:800;padding:.15rem .45rem;border-radius:4px;letter-spacing:.03em}
.badge.green{background:#16a34a;color:#fff}
.badge.amber{background:#d97706;color:#fff}
.badge.grey{background:#475569;color:#cbd5e1}

/* Grid */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:.3rem .75rem}
.info-grid.three{grid-template-columns:1fr 1fr 1fr}
.info-row{font-size:.83rem}
.info-row .label{color:#64748b;font-size:.75rem;margin-bottom:.05rem}
.info-row strong{color:#f1f5f9}
code{background:#0f172a;border:1px solid #334155;color:#a5f3fc;padding:.1rem .4rem;border-radius:4px;font-size:.82rem;font-family:'SF Mono',Consolas,monospace}

/* Emergency highlight */
.emergency{background:#450a0a;border:1px solid #7f1d1d;border-radius:10px;padding:1rem 1.2rem;margin-bottom:.75rem}
.emergency-title{font-size:.7rem;font-weight:800;letter-spacing:.1em;color:#fca5a5;text-transform:uppercase;margin-bottom:.6rem}
.emergency-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem .75rem;font-size:.84rem}
.emergency-grid .label{color:#fca5a5;font-size:.74rem}
.emergency-grid strong{color:#fecaca}

/* Flights */
.flight-row{display:grid;grid-template-columns:auto 1fr auto;gap:.4rem 1rem;align-items:center;padding:.6rem 0;border-bottom:1px solid #1e293b}
.flight-row:last-child{border-bottom:none}
.flight-arrow{color:#f59e0b;font-weight:900;font-size:1rem}
.flight-info{font-size:.83rem;color:#94a3b8}
.flight-main{font-size:.9rem;font-weight:700;color:#f1f5f9}

/* TBD placeholder */
.tbd{background:#1a2235;border:1px dashed #334155;border-radius:8px;padding:.75rem 1rem;color:#475569;font-size:.83rem;font-style:italic;text-align:center;margin:.4rem 0}

/* Passport */
.passport-row{display:grid;grid-template-columns:120px 1fr;gap:.4rem .75rem;font-size:.84rem;padding:.4rem 0;border-bottom:1px solid #1e293b}
.passport-row:last-child{border-bottom:none}
.passport-name{font-weight:700;color:#f1f5f9}
.passport-detail{color:#94a3b8}

/* People */
.people-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
.person-card{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:.9rem}
.person-name{font-weight:800;font-size:.9rem;color:#f8fafc;margin-bottom:.4rem}
.person-detail{font-size:.78rem;color:#94a3b8;line-height:1.5}

/* Footer */
.footer{border-top:1px solid #1e293b;padding:1.5rem;text-align:center;font-size:.75rem;color:#475569;margin-top:2rem}

@media(max-width:600px){
  .info-grid,.info-grid.three,.people-grid{grid-template-columns:1fr 1fr}
  .emergency-grid{grid-template-columns:1fr}
}
</style>

<style>
.lockwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:#0f172a}
.lockcard{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:2rem 1.8rem;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.lockcard .emoji{font-size:1.7rem}
.lockcard h1{font-size:1.15rem;color:#f8fafc;margin:.6rem 0 .3rem;font-weight:800}
.lockcard p{font-size:.85rem;color:#94a3b8;margin-bottom:1.1rem}
.lockcard input{width:100%;border:1px solid #334155;background:#0f172a;color:#f1f5f9;border-radius:10px;padding:.7rem .9rem;font-size:1rem;outline:none;margin-bottom:.7rem;text-align:center}
.lockcard input:focus{border-color:#d97706}
.lockcard button{width:100%;background:#b8532b;color:#fff;border:none;border-radius:10px;padding:.7rem;font-size:.95rem;font-weight:700;cursor:pointer}
.lockcard button:hover{background:#9c4523}
.lockcard .err{color:#fca5a5;font-size:.82rem;margin-top:.6rem;min-height:1.1em}
</style>
</head>
<body>

<div class="lockwrap">
  <div class="lockcard">
    <div class="emoji">🔒🍁</div>
    <h1>Asia 2026 · Trip Dossier</h1>
    <p>Private. Enter the passphrase to view.</p>
    <input id="pw" type="password" placeholder="Passphrase" autocomplete="off">
    <button onclick="unlock()">Unlock</button>
    <div class="err" id="err"></div>
  </div>
</div>
